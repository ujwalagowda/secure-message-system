# ============================================================
# SECURE MESSAGE COMMUNICATION SYSTEM
# application.properties
# ============================================================

# ============================================================
# APPLICATION
# ============================================================
spring.application.name=secure-message-system

# Spring Boot server
server.port=8085


# ============================================================
# MYSQL DATABASE
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/secure_msg_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ============================================================
# JWT AUTHENTICATION
# ============================================================
# Use a secret of at least 32 characters.
# This is used only for JWT signing.

jwt.secret=SecureMessageSystem_RSA_Project_2026_JWT_SECRET_Key
jwt.expiration-ms=86400000


# ============================================================
# RSA CONFIGURATION
# ============================================================
# RSA key size
rsa.key-size=2048

# Maximum plaintext message length (characters).
# RSA-2048 with OAEP/SHA-256 padding formula:
#   max = keySize/8 - 2*hashLength - 2
#       = 256 - 2*32 - 2 = 190 bytes
# 190 characters is the safe enforced limit (1 ASCII char = 1 byte).
rsa.max-message-length=190


# ============================================================
# LOGGING
# ============================================================
logging.level.com.securemsg=DEBUG

logging.level.org.springframework.security=INFO

logging.level.org.hibernate.SQL=DEBUG


# ============================================================
# JACKSON / JSON
# ============================================================
spring.jackson.default-property-inclusion=non_null

spring.jackson.serialization.write-dates-as-timestamps=false